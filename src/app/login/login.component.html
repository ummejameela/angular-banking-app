<p>login works!</p>
<div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <input id="username-input" type="text" placeholder="Enter UserName" formControlName="username" />
        <input id="password-input" type="password" placeholder="Enter Password" formControlName="password"
            autocomplete="current-password" />
        <button [disabled]="loginForm.invalid">Submit</button>
        <p *ngIf="error" style="color: red;"><strong>{{error}}</strong></p>

    </form>
    <div>
    </div>
</div>
